spring:
  application:
    name: auth-batch
  main:
    web-application-type: none
  datasource:
    url: jdbc:postgresql://localhost:5432/auth
    username: auth
    password: auth
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  autoconfigure:
    # app-api와 동일 — 다중 스키마는 SchemaMigrationConfig가 스키마별 실행(Boot 단일 Flyway는 버전 충돌).
    exclude:
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 250ms
      # 연결 수립 stall 상한. 재연결 중 명령 큐잉 거부(REJECT_COMMANDS)와 함께 RedisClientConfig가 조립한다.
      connect-timeout: 250ms

# PII 봉투 암호화·blind index 키(dev 정적 — app-api와 동일 키). prod는 시크릿 매니저 주입.
crypto:
  envelope:
    active-version: 1
    keys: "1:vO5tqt9e8TOJ/R/qBbltt+FHyWJdL0khopfmCTfTxFo="
  blind-index:
    active-version: 1
    peppers: "1:RqbTfuuNIU/NaYFmNMpGwU7jj0e+9YXIOytVeqnh4Ms="

app:
  migration:
    # 배치가 접근하는 스키마(기동 검증용 — 운영 배포에서는 app-migration이 선행 실행된다).
    schemas: auth,usr,msg,generic
  batch:
    # 실행할 잡 CSV(빈 값이면 아무것도 실행하지 않는다): dormancy-notice, dormancy-transition, retention-purge
    jobs: ""

user:
  retention:
    rejoin-cooldown-days: 30
    dormancy-months: 12
    dormancy-notice-days: 30
    verification-pii-purge-days: 5
    ci-tombstone-months: 6
    consent-retention-years: 5
  identity-verification:
    ttl-minutes: 10
    mode: mock

auth:
  retention:
    login-attempt-years: 2
    login-ip-anonymize-days: 90
