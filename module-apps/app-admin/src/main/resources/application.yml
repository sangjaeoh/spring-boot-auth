spring:
  application:
    name: auth-admin
  datasource:
    url: jdbc:postgresql://localhost:5432/auth
    username: auth
    password: auth
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  autoconfigure:
    # app-api와 동일 — 다중 스키마는 SchemaMigrationConfig가 스키마별 실행(Boot 단일 Flyway는 버전 충돌).
    exclude:
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 250ms
      # 연결 수립 stall 상한. 재연결 중 명령 큐잉 거부(REJECT_COMMANDS)와 함께 RedisClientConfig가 조립한다.
      connect-timeout: 250ms

server:
  # app-api(8080)와 분리 기동한다(어드민은 내부망 노출 전제).
  port: 8081

# 관측성(app-api와 동일 방침 — 관리 포트 분리·내부망 전용, 지표·SLO: docs/ops/observability-slo.md).
management:
  server:
    port: 9405
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

# PII 봉투 암호화 KEK·blind index pepper(app-api와 동일 시크릿 주입 — 같은 데이터를 복호·조회한다).
# 키 원문은 레포에 두지 않는다. 주입 계약·로컬 부트스트랩은 app-api application.yml 주석과 동일.
crypto:
  envelope:
    active-version: ${CRYPTO_ENVELOPE_ACTIVE_VERSION:1}
    keys: ${CRYPTO_ENVELOPE_KEYS}
  blind-index:
    active-version: ${CRYPTO_BLIND_INDEX_ACTIVE_VERSION:1}
    peppers: ${CRYPTO_BLIND_INDEX_PEPPERS}

app:
  migration:
    # 어드민이 접근하는 스키마(기동 검증용 — 운영 배포에서는 app-migration이 선행 실행된다).
    # keyring(JWT 서명키 원장)을 app-api와 공유해 app-api 발급 토큰을 어드민이 검증한다.
    schemas: auth,usr,msg,generic,keyring

user:
  retention:
    rejoin-cooldown-days: 30
    dormancy-months: 12
    dormancy-notice-days: 30
    verification-pii-purge-days: 5
    ci-tombstone-months: 6
    consent-retention-years: 5
  identity-verification:
    ttl-minutes: 10
    mode: mock

auth:
  retention:
    login-attempt-years: 2
    login-ip-anonymize-days: 90
