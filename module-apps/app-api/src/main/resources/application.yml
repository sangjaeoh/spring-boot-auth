spring:
  application:
    name: auth-api
  datasource:
    url: jdbc:postgresql://localhost:5432/auth
    username: auth
    password: auth
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  autoconfigure:
    # 다중 스키마(auth+usr)는 SchemaMigrationConfig가 SchemaFlywayFactory로 스키마별 실행한다. Boot 단일
    # Flyway는 db/migration 재귀스캔으로 auth V1·usr V1이 버전 충돌하므로 Flyway auto-config만 끈다
    # (JPA auto-config는 유지 — app-migration의 전체 exclude를 베끼지 않는다).
    exclude:
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
  data:
    redis:
      host: localhost
      port: 6379
      # 정상 연결의 명령 타임아웃 상한 — 멈춘 노드(부분 failover)에서 fail-closed 지연을 유계로 만든다.
      # prod Cluster 노드 접속(spring.data.redis.cluster.nodes 등)은 배포 오버레이가 소유.
      timeout: 250ms
      # 연결 수립 stall 상한. 재연결 중 명령 큐잉 거부(REJECT_COMMANDS)와 함께 RedisClientConfig가 조립한다.
      connect-timeout: 250ms

# PII 봉투 암호화 KEK(JWT 서명키 keyring 봉투암호 겸용)·blind index pepper. 키 원문은 레포에 두지 않는다 —
# 시크릿 매니저가 환경변수로 주입하고(주입 계약: docs/ops/deployment.md), 미주입 기동은 placeholder 미해결로
# fail-fast한다. 로컬은 scripts/generate-dev-secrets.sh가 만든 .dev-secrets.env를 source한다.
# keys/peppers는 "version:base64[,version:base64]" — 회전 시 새 버전 추가 + active-version 상향
# (구 암호문은 동봉 버전으로 복호되어 전 행 재암호화 불요). KEK와 pepper는 분리 보관한다(pepper 유출 시
# blind index 역추론 가능).
crypto:
  envelope:
    active-version: ${CRYPTO_ENVELOPE_ACTIVE_VERSION:1}
    keys: ${CRYPTO_ENVELOPE_KEYS}
  blind-index:
    active-version: ${CRYPTO_BLIND_INDEX_ACTIVE_VERSION:1}
    peppers: ${CRYPTO_BLIND_INDEX_PEPPERS}

app:
  migration:
    # 이 앱이 영속하는 스키마(SchemaMigrationConfig가 스키마별 Flyway 실행). 스키마 추가 시 등록.
    # msg는 infra-messaging 소유(디둡·DLQ), keyring은 infra-keystore 소유(JWT 서명키 원장) — 기술 스키마다.
    schemas: auth,usr,msg,generic,keyring

generic:
  notification:
    # 카테고리 알림 발송 어댑터: mock(오프라인 dev/test) | vendor(실 발송). 조달(벤더 계약·키 발급) 완료 시
    # vendor로 전환하고 generic.notification.{email|sms|push}.* 키를 주입한다(미주입 기동은 fail-fast).
    mode: mock

user:
  retention:
    # 보존·파기 정책값(정본: DOMAIN_MODEL 보존·파기 스케줄 — 설정 외부화, 하드코딩 금지).
    # 파기 집행은 app-batch 잡이 소유하고, 쿨다운 판정은 가입 경로(CiUniquenessValidator)가 쓴다.
    rejoin-cooldown-days: 30
    dormancy-months: 12
    dormancy-notice-days: 30
    verification-pii-purge-days: 5
    ci-tombstone-months: 6
    consent-retention-years: 5
  identity-verification:
    # 본인인증 진행 만료(expiresAt 계산). 경과분은 app-batch EXPIRED 스윕이 수렴한다.
    ttl-minutes: 10
    # 본인인증 어댑터: mock(오프라인 dev/test) | nice(실 기관). 조달(계약·사이트코드) 완료 시 nice로
    # 전환하고 user.identity-verification.nice.{site-code,client-id,client-secret}를 주입한다
    # (미주입 기동은 fail-fast). 전환은 설정만으로 이뤄진다 — 도메인 무변경.
    mode: mock

auth:
  retention:
    # 로그인이력 보존 2년 + IP 90일 후 가명화(안전성 확보조치 기준 §8① — 집행은 app-batch).
    login-attempt-years: 2
    login-ip-anonymize-days: 90
  session:
    # 동시 활성 세션 상한(정책 확정 3). 초과 생성은 최오래(issuedAt) 세션을 Lua 원자 축출한다.
    max-concurrent: 3
    revoke-durability:
      # revoke 계열 쓰기의 WAIT 최소 복제 확인 수. 0=미사용(단일 노드 dev/test). prod Cluster
      # 오버레이가 1 이상으로 설정해 failover 시 무효화 유실을 차단한다. 시한 내 미달은 503(fail-closed).
      min-replicas: 0
      timeout-ms: 250
  registration:
    # 온보딩 세션 TTL(모델 확정 범위 30~60분). 만료 시 Redis가 자동 파기한다(영속 PENDING 금지).
    ttl-minutes: 30
  social:
    # 소셜 id_token 검증 어댑터: mock(오프라인 dev/test) | oidc(실 4사). 조달 완료 시 oidc로 전환하고
    # auth.social.oidc.{kakao|naver|google|apple}.client-id를 주입한다(발급자·JWKS URI는 게시 기본값).
    mode: mock
  jwt:
    jwks:
      # 유예 창 ≥ 2×Access TTL(15분). 회전된 키를 이 기간 검증·게시한 뒤 축출한다.
      grace-minutes: 30
      # 서명키 자동 회전 주기(ISO-8601 — Spring @Scheduled는 "90d"를 못 읽는다). 회전 판정 주기
      # (rotation-check-interval)·스토어 재적재 주기(refresh-interval)는 기본값 PT1H·PT1M을 쓴다.
      rotation-period: P90D
  password:
    hashing:
      # 동시 Argon2 실행 상한(0=auto=가용 코어수). peak Argon2 힙 ≈ max-concurrent × argon2.memory-kb(≈코어×19MB).
      # 상한 초과 요청은 acquire-timeout-ms까지 permit을 대기한 뒤 503으로 차단한다.
      max-concurrent: 0
      acquire-timeout-ms: 500
