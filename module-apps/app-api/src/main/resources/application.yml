spring:
  application:
    name: auth-api
  datasource:
    url: jdbc:postgresql://localhost:5432/auth
    username: auth
    password: auth
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  autoconfigure:
    # 다중 스키마(auth+usr)는 SchemaMigrationConfig가 SchemaFlywayFactory로 스키마별 실행한다. Boot 단일
    # Flyway는 db/migration 재귀스캔으로 auth V1·usr V1이 버전 충돌하므로 Flyway auto-config만 끈다
    # (JPA auto-config는 유지 — app-migration의 전체 exclude를 베끼지 않는다).
    exclude:
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
  data:
    redis:
      host: localhost
      port: 6379
      # 정상 연결의 명령 타임아웃 상한 — 멈춘 노드(부분 failover)에서 fail-closed 지연을 유계로 만든다.
      # 연결단 stall(connectTimeout)·재연결 큐잉(disconnectedBehavior)은 별도이며 Lettuce 옵션 후속(REDIS_HA.md).
      # prod Cluster 노드 접속(spring.data.redis.cluster.nodes 등)은 배포 오버레이가 소유.
      timeout: 250ms

# PII 봉투 암호화·blind index 키(dev 정적). prod는 시크릿 매니저 주입 + 분리 보관(pepper 유출 시 blind index
# 역추론 가능). keys/peppers는 "version:base64[,version:base64]" — 회전 시 새 버전 추가 + active-version 상향
# (구 암호문은 동봉 버전으로 복호되어 전 행 재암호화 불요).
crypto:
  envelope:
    active-version: 1
    keys: "1:vO5tqt9e8TOJ/R/qBbltt+FHyWJdL0khopfmCTfTxFo="
  blind-index:
    active-version: 1
    peppers: "1:RqbTfuuNIU/NaYFmNMpGwU7jj0e+9YXIOytVeqnh4Ms="

app:
  migration:
    # 이 앱이 영속하는 도메인 스키마(SchemaMigrationConfig가 스키마별 Flyway 실행). 스키마 추가 시 등록.
    schemas: auth,usr

user:
  identity-verification:
    # 본인인증 진행 만료(expiresAt 계산). EXPIRED 스윕은 P4 — 그 전까지는 기준 시각 기록만.
    ttl-minutes: 10

auth:
  registration:
    # 온보딩 세션 TTL(모델 확정 범위 30~60분). 만료 시 Redis가 자동 파기한다(영속 PENDING 금지).
    ttl-minutes: 30
  social:
    # 소셜 id_token 검증 어댑터: mock(오프라인 dev/test) | oidc(실 4사). 조달 완료 시 oidc로 전환하고
    # auth.social.oidc.{kakao|naver|google|apple}.client-id를 주입한다(발급자·JWKS URI는 게시 기본값).
    mode: mock
  jwt:
    jwks:
      # 유예 창 ≥ 2×Access TTL(15분). 회전된 키를 이 기간 검증·게시한 뒤 축출한다.
      grace-minutes: 30
  password:
    hashing:
      # 동시 Argon2 실행 상한(0=auto=가용 코어수). peak Argon2 힙 ≈ max-concurrent × argon2.memory-kb(≈코어×19MB).
      # 상한 초과 요청은 acquire-timeout-ms까지 permit을 대기한 뒤 503으로 차단한다.
      max-concurrent: 0
      acquire-timeout-ms: 500
