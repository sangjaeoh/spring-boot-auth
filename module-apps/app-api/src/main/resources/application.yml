spring:
  application:
    name: auth-api
  datasource:
    url: jdbc:postgresql://localhost:5432/auth
    username: auth
    password: auth
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration/auth
    schemas: auth
  data:
    redis:
      host: localhost
      port: 6379

auth:
  jwt:
    jwks:
      # 유예 창 ≥ 2×Access TTL(15분). 회전된 키를 이 기간 검증·게시한 뒤 축출한다.
      grace-minutes: 30
