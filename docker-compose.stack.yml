# 컨테이너 스택(로컬 prod-유사 검증용) — app-migration을 init 컨테이너로 선행 실행한 뒤 앱을 띄운다.
# 배포 순서 계약의 로컬 재현이다(정본: docs/ops/deployment.md — 마이그레이션·롤아웃 규약).
# 사용:
#   ./scripts/generate-dev-secrets.sh   # 최초 1회(.dev-secrets.env)
#   docker build --build-arg APP=app-migration -t auth-migration .
#   docker build --build-arg APP=app-api -t auth-api .
#   docker build --build-arg APP=app-admin -t auth-admin .
#   docker compose -f docker-compose.stack.yml up
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # init 컨테이너: 스키마별 Flyway를 전부 적용하고 성공 종료(exit 0)해야 앱 롤아웃이 시작된다.
  migration:
    image: auth-migration
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth

  api:
    image: auth-api
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file: .dev-secrets.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8080:8080"
      # 관리 포트는 로컬 검증 편의로만 게시한다 — prod는 내부망 전용(비게시).
      - "9404:9404"

  admin:
    image: auth-admin
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file: .dev-secrets.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8081:8081"
      - "9405:9405"
