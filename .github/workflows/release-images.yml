# CD 최소안: 버전 태그(v*) 푸시 시 4개 앱 이미지를 빌드해 GHCR에 게시한다.
# 품질 게이트 CI(빌드·테스트)는 별도 워크플로 소유(todo 1번) — 태그는 게이트 통과 커밋에만 붙인다는 규약.
# 배포(롤아웃 순서·카나리)는 docs/ops/deployment.md 규약을 따른다.
name: release-images

# 자동 실행 비활성화(솔로 레포라 CI 불필요) — 태그 푸시 트리거를 껐다. 되살리려면 아래 주석을 푼다.
# on:
#   push:
#     tags: ["v*"]
on:
  workflow_dispatch: # 수동 실행만 허용(자동 실행 없음)

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [app-api, app-admin, app-batch, app-migration]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.ref_name }}
