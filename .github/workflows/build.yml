# 품질 게이트 CI: main 푸시·PR에서 `./gradlew build`를 원격 강제한다.
# build = Spotless·NullAway·Error Prone·ArchUnit + 전체 테스트(Testcontainers가 Postgres/Redis를 러너 Docker로 직접 기동 — 서비스 선언 불필요).
# 태그 릴리스(release-images.yml)는 이 게이트를 통과한 커밋에만 붙인다는 규약.
name: build

# 자동 실행 비활성화(솔로 레포라 CI 불필요) — push·PR 트리거를 껐다. 되살리려면 아래 주석을 푼다.
# on:
#   push:
#     branches: ["main"]
#   pull_request:
on:
  workflow_dispatch: # 수동 실행만 허용(자동 실행 없음)

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
