# 버전 정본(single source of truth). docs/code-quality.md의 표는 편의 사본이며 불일치 시 이 파일이 이긴다.
# Flyway·Testcontainers·PostgreSQL 드라이버 버전은 Spring Boot BOM(plaform)이 관리하므로 여기서 핀하지 않는다.

[versions]
java = "25"
spring-boot = "4.1.0"
spotless = "8.8.0"
palantir-java-format = "2.94.0"
errorprone-plugin = "5.1.0"
errorprone = "2.50.0"
nullaway = "0.13.7"
jspecify = "1.0.0"
archunit = "1.4.2"

[libraries]
# BOM (Gradle 네이티브 platform로 임포트)
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

# 애노테이션 · 정적분석 (errorprone 설정에 배선)
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

# spring / 영속 (버전은 BOM이 관리)
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
postgresql = { module = "org.postgresql:postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
# Spring Boot 4는 Flyway auto-config를 별도 모듈로 분리했다. flyway-core만으로는 마이그레이션이 실행되지 않는다.
spring-boot-flyway = { module = "org.springframework.boot:spring-boot-flyway" }

# 테스트 (archunit만 명시 핀, 나머지는 BOM)
# Testcontainers 2.0에서 모듈 좌표 rename: org.testcontainers:postgresql → :testcontainers-postgresql,
# :junit-jupiter → :testcontainers-junit-jupiter (구 좌표는 2.0에서 제거). SB 4.1 BOM = testcontainers 2.0.5.
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
# Gradle 9는 JUnit Platform launcher를 자동 제공하지 않으므로 testRuntime에 명시한다(버전은 BOM).
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# build-logic 컨벤션 플러그인이 의존하는 Gradle 플러그인 아티팩트
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
errorprone-gradle-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
